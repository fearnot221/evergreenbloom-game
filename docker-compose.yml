services:
  game:
    build:
      context: .
      args:
        VITE_WEBSITE_URL: ${VITE_WEBSITE_URL:-https://fearnot221.github.io/evergreenbloom-website/}
    ports:
      - "127.0.0.1:${GAME_PORT:-8080}:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      STAFF_USERNAME: ${STAFF_USERNAME:?Set the initial staff username}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?Set a strong initial staff password}
      STAMP_KEYS: ${STAMP_KEYS:?Set private station codes as a JSON object}
      DATABASE_PATH: /data/game.sqlite
      # Published on 127.0.0.1 only, so traffic always arrives through the HTTPS proxy.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Days to keep photos that were not picked; 0 keeps them until set.
      PHOTO_RETENTION_DAYS: ${PHOTO_RETENTION_DAYS:-0}
      # Optional Google sign-in (OAuth web client); leave both empty to turn it off.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - game-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  game-data:
